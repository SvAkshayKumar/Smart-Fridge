

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Smart Fridge Camera</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #controls button { font-size: 1.2em; padding: 10px 20px; cursor: pointer; }
        #streamContainer { 
            margin-top: 20px; 
            border: 2px solid #ccc; 
            min-width: 640px; 
            min-height: 480px; 
            margin-left: auto; 
            margin-right: auto; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            background-color: #000;
        }
        #streamContainer img { max-width: 100%; }
        #status { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>Smart Fridge Live View</h1>
    <div id="controls">
        <button id="startBtn">Start Live</button>
        <button id="stopBtn" style="display:none;">Stop Live</button>
    </div>
    <div id="streamContainer">
        <p id="status">Press "Start Live" to begin streaming.</p>
    </div>

    <script>
        const startButton = document.getElementById('startBtn');
        const stopButton = document.getElementById('stopBtn');
        const container = document.getElementById('streamContainer');
        const statusText = document.getElementById('status');

        let streamImage = null;

        function startStream() {
            // Clear the container
            container.innerHTML = '';
            statusText.style.display = 'none';

            // Create a new image element for the stream
            streamImage = document.createElement('img');
            // The src is our Python server's relay endpoint.
            // Add a timestamp to prevent caching.
            streamImage.src = '/video_feed?' + new Date().getTime();
            
            streamImage.onerror = () => {
                container.innerHTML = '<p style="color:red;">Error: Could not connect to the camera stream. Is the ESP32 on and connected?</p>';
                stopStream(); // Reset buttons
            };

            container.appendChild(streamImage);

            // Update button visibility
            startButton.style.display = 'none';
            stopButton.style.display = 'block';
        }

        function stopStream() {
            if (streamImage) {
                // Setting the src to empty effectively stops the browser from loading the stream
                streamImage.src = '#';
                streamImage.remove();
                streamImage = null;
            }
            container.innerHTML = '<p id="status">Stream stopped.</p>';

            // Update button visibility
            startButton.style.display = 'block';
            stopButton.style.display = 'none';
        }

        startButton.addEventListener('click', startStream);
        stopButton.addEventListener('click', stopStream);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header">
        <h1>Smart Fridge Dashboard</h1>
        <div class="notification-area" id="notification-area">
            <i class="fas fa-bell" id="bell-icon"></i>
            <span class="notification-badge" id="notification-badge">0</span>
            <div class="notification-panel" id="notification-panel">
                <!-- Notifications will be injected here -->
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">Latest Logs</h2>
        <div class="logs-container" id="logs-container">
            <!-- Latest logs will be dynamically inserted here -->
            <p class="placeholder">Fetching latest logs...</p>
        </div>
    </div>

    <!-- Modal for Detailed Analysis (Initially Hidden) -->
    <div class="modal" id="details-modal">
        <div class="modal-content">
            <span class="close-button" id="close-button">&times;</span>
            <div class="modal-top-section">
                <div class="modal-card" id="image-card">
                    <h3>Photo</h3>
                    <div id="image-container">
                        <p class="placeholder">No image</p>
                    </div>
                </div>
                <div class="modal-card" id="inventory-card">
                    <h3>List of items</h3>
                    <div id="inventory-container">
                        <p class="placeholder">No items</p>
                    </div>
                </div>
                <div class="modal-card" id="recipes-card">
                    <h3>Recipe Suggestions</h3>
                    <div id="recipes-container">
                        <p class="placeholder">No suggestions</p>
                    </div>
                </div>
            </div>
            <div class="modal-bottom-section" id="recipe-steps-container">
                <p class="placeholder">Click on a recipe suggestion above to see the steps.</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

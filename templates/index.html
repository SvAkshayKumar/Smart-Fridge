<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Fridge Camera</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #captureBtn { font-size: 1.2em; padding: 10px 20px; cursor: pointer; }
        #imageContainer { margin-top: 20px; border: 2px dashed #ccc; width: 240px; height: 240px; margin-left: auto; margin-right: auto; display: flex; justify-content: center; align-items: center; }
        #imageDisplay { max-width: 100%; max-height: 100%; }
        #message { color: #888; }
    </style>
</head>
<body>
    <h1>Smart Fridge Camera</h1>
    <button id="captureBtn">Capture Image</button>
    <div id="imageContainer">
        <p id="message">Click the button to see the image</p>
        <img id="imageDisplay" src="" alt="Captured from fridge" style="display:none;">
    </div>

    <script>
        document.getElementById('captureBtn').addEventListener('click', function() {
            var image = document.getElementById('imageDisplay');
            var message = document.getElementById('message');
            
            message.innerText = 'Requesting image...';
            image.style.display = 'none';

            var imageUrl = '/get_image?' + new Date().getTime();
            
            image.onload = function() {
                message.style.display = 'none';
                image.style.display = 'block';
            };
            image.onerror = function() {
                message.innerText = 'Failed to load image.';
                message.style.display = 'block';
                image.style.display = 'none';
            };
            image.src = imageUrl;
        });
    </script>
</body>
</html>

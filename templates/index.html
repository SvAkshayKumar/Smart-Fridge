
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="main-header">
        <h1>Smart Fridge Dashboard</h1>
        <div class="notification-area" id="notification-area">
            <i class="fas fa-bell" id="bell-icon"></i>
            <span class="notification-badge" id="notification-badge">0</span>
            <div class="notification-panel" id="notification-panel">
                <!-- Notifications will be injected here by app.js -->
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Section for the 5 latest records -->
        <h2 class="section-title">Latest Scans</h2>
        <div class="records-carousel" id="records-carousel">
            <!-- Record cards will be dynamically inserted here by app.js -->
            <p class="placeholder">Fetching latest scans...</p>
        </div>

        <!-- Section for detailed analysis of the selected record -->
        <h2 class="section-title">Detailed Analysis</h2>
        <div class="details-grid" id="details-grid">
            <div class="dashboard-card card-large" id="image-card">
                <h2><i class="fas fa-camera"></i> Captured Image</h2>
                <div id="image-container">
                    <p class="placeholder">Select a scan above to view details.</p>
                </div>
            </div>

            <div class="dashboard-card" id="inventory-card">
                <h2><i class="fas fa-shopping-basket"></i> Detected Inventory</h2>
                <div id="inventory-container">
                    <p class="placeholder">No items detected.</p>
                </div>
            </div>

            <div class="dashboard-card" id="recipes-card">
                <h2><i class="fas fa-lightbulb"></i> Recipe Ideas</h2>
                <div id="recipes-container">
                    <p class="placeholder">No recipe suggestions available.</p>
                </div>
            </div>
            
            <div class="dashboard-card card-large" id="chart-card">
                <h2><i class="fas fa-chart-bar"></i> Inventory Analysis</h2>
                <div id="chart-container">
                    <canvas id="inventoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="page-title">Smart Fridge Dashboard</h1>
        
        <!-- Section for the Latest Captured Image -->
        <div class="dashboard-card">
            <h2>Last Captured Image</h2>
            <div id="image-container">
                <p class="placeholder">Awaiting first scan from your fridge...</p>
            </div>
        </div>

        <!-- Section for Detected Items -->
        <div class="dashboard-card">
            <h2>Detected Inventory</h2>
            <div id="inventory-container">
                <!-- Item list will be populated here by JavaScript -->
            </div>
        </div>

        <!-- Section for Gemini's Analysis -->
        <div class="dashboard-card">
            <h2>Gemini's Analysis</h2>
            <div id="analysis-container">
                <!-- AI suggestions will be populated here by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const imageContainer = document.getElementById('image-container');
            const inventoryContainer = document.getElementById('inventory-container');
            const analysisContainer = document.getElementById('analysis-container');

            try {
            const response = await fetch('/latest');
            const data = await response.json();

            // 1. Populate the Image
            console.log("Latest data received:", data);
            if (data && data.image_url) {
                imageContainer.innerHTML = `<img src="${data.image_url}" alt="Latest fridge content" class="fridge-image">`;
            } else {
                imageContainer.innerHTML = `<p class="placeholder">No image captured yet.</p>`;
            }

            // 2. Populate the Inventory List
            if (data && data.items && data.items.length > 0) {
                const itemsHtml = data.items.map(item => `<li>${item.quantity} x ${item.type}</li>`).join('');
                inventoryContainer.innerHTML = `<ul class="item-list">${itemsHtml}</ul>`;
            } else {
                inventoryContainer.innerHTML = `<p class="placeholder">No items detected yet.</p>`;
            }

            // 3. Populate Gemini's Analysis
if (data && data.gemini_analysis) {
    // Parse gemini_analysis JSON if needed
    const analysis = typeof data.gemini_analysis === "string"
        ? JSON.parse(data.gemini_analysis)
        : data.gemini_analysis;

    console.log("Gemini analysis received:", analysis);
    console.log("Recipe suggestions:", analysis.recipeSuggestions);

    const recipesHtml = (analysis.recipeSuggestions || []).map(r => `<li>${r}</li>`).join('');
                
    let analysisHtml = `
        <div class="recipes">
            <h3>Recipe Ideas:</h3>
            <ul>${recipesHtml}</ul>
        </div>
    `;

    if (analysis.isOrderRequired) {
        localStorage.setItem('fridgeData', JSON.stringify(analysis));
        analysisHtml += `<a href="/cart" class="btn-primary">View Suggested Order &rarr;</a>`;
    } else {
        analysisHtml += `<p><strong>Order Status:</strong> You seem to be well-stocked for now!</p>`;
    }
    analysisContainer.innerHTML = analysisHtml;
} else {
     analysisContainer.innerHTML = `<p class="placeholder">No analysis available.</p>`;
}


        } catch (error) {
            console.error("Error fetching latest data:", error);
            analysisContainer.innerHTML = '<p>Could not load analysis from the server.</p>';
        }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="/" class="back-arrow">&lt;</a>
            <h3>Cart</h3>
            <div class="super-saver">Super Saver</div>
        </div>

        <div class="content">
            <div class="info-banner">
                <p>Free Delivery auto applied on this order</p>
            </div>

            <div class="card" id="delivery-card">
                <div class="delivery-time">
                    <span class="clock-icon">🕒</span>
                    <span>Delivery in 20 mins</span>
                </div>
                <div id="cart-items-container">
                    <!-- Cart items will be injected here by JavaScript -->
                </div>
                <button class="add-more-btn">+ Add More Items</button>
            </div>

            <div class="card" id="price-drop-card">
                <h4>Price Drop Alert</h4>
                <div class="suggestions-container" id="suggestions-container">
                    <!-- Suggestion items will be injected here by JavaScript -->
                </div>
            </div>

            <div class="card" id="delivery-address-card">
                <h4>Delivering to Other ⌄</h4>
                <p>room number 22, shri ranga pg for gents, Global vil...</p>
            </div>
             <div class="card no-bag-card">
                <p>✅ We have opted you in for no bag delivery 🌿</p>
            </div>
        </div>

        <div class="footer">
            <a href="/order-placed" id="pay-button" class="pay-button">
                Click to Pay ₹0.00
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

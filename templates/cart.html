<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cart.css') }}">
</head>
<body>

    <div class="mobile-view-container">
        <!-- Confetti Container -->
        <div id="confetti-container"></div>

        <div class="app-container">
            <div class="header">
                <a href="/" class="back-arrow">&lt;</a>
                <h3>Cart</h3>
                <div class="super-saver">Super Saver</div>
            </div>

            <div class="content">
                <!-- Dynamic delivery banner -->
                <div class="info-banner" id="delivery-status-banner" style="display: none;">
                    <!-- Content is controlled by JS -->
                </div>

                <!-- Coupon Card -->
                <div class="card coupon-card" id="coupon-card">
                    <div class="coupon-content">
                        <span class="coupon-icon">%</span>
                        <div class="coupon-details">
                            <span class="coupon-title">Apply Coupon</span>
                            <input type="text" id="coupon-input" placeholder="Enter code SAVER99">
                        </div>
                        <button id="apply-coupon-btn">Apply</button>
                    </div>
                    <div id="coupon-message" class="coupon-success-message"></div>
                </div>

                <div class="card" id="delivery-card">
                    <div class="delivery-time">
                        <span><strong>Delivery in 20 mins</strong></span>
                    </div>
                    <div id="cart-items-container">
                        <!-- Cart items are loaded here by JavaScript -->
                    </div>
                    <button class="add-more-btn">+ Add More Items</button>
                </div>

                <!-- Bill Details Card -->
                <div class="card" id="bill-details-card">
                    <h4>Bill Details</h4>
                    <div class="bill-row">
                        <span>Item Total</span>
                        <span id="bill-item-total">₹0.00</span>
                    </div>
                    <div class="bill-row" id="bill-discount-row" style="display: none;">
                        <span>Discount</span>
                        <span id="bill-discount-amount" class="discount-text">- ₹0.00</span>
                    </div>
                    <div class="bill-row" id="bill-delivery-row">
                        <span>Delivery Fee</span>
                        <span id="bill-delivery-fee">₹0.00</span>
                    </div>
                    <hr>
                    <div class="bill-row total-bill">
                        <strong><span>To Pay</span></strong>
                        <strong><span id="bill-grand-total">₹0.00</span></strong>
                    </div>
                </div>

                <!-- Price Drop Card -->
                <div class="card" id="price-drop-card">
                    <h4>Price Drop Alert</h4>
                    <div class="suggestions-container" id="suggestions-container">
                        <!-- Suggestion items are loaded here by JavaScript -->
                    </div>
                </div>

                <!-- Address Dropdown -->
                <div class="card" id="delivery-address-card">
                    <h4>Delivering to ⌄</h4>
                     <select id="address-dropdown" class="address-dropdown">
                        <option value="addr1">#302,C Block,RV University,Banglore</option>
                        <option value="addr2">#502, Mechanical Block, RVCE, Bangalore</option>
                    </select>
                </div>
            </div>

            <div class="footer">
                <!-- *** IMPORTANT CHANGE: This is now a <button> instead of an <a> tag *** -->
                <button id="pay-button" class="pay-button">
                    <div class="footer-price-details">
                         <span id="total-price-display">₹0.00</span>
                         <span class="view-bill-text">View Detailed Bill</span>
                    </div>
                    <span>Proceed to Pay</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast/Modal for Notifications -->
    <div id="toast-overlay" class="hidden">
        <div id="toast-message">
            <p id="toast-text"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='cart.js') }}"></script>
</body>
</html>
